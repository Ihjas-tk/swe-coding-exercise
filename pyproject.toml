[project]
name = "answer-engine"
version = "0.1.0"
description = "Answer engine for engineering documents: local extraction, hybrid retrieval, cited answers, staged evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf==1.28.2",
    "pdfplumber==0.11.10",
    "pytesseract==0.3.13",
    "pillow>=11.0",
    "docling==2.132.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "anthropic==1.11.0",
    "sentence-transformers==6.1.0",
    "numpy>=2.0",
    "pydantic>=2.0",
    "typer>=0.15",
    "rich>=13.0",
    "jiwer==4.0.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "apted>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ae = "ae.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ae"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "N", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "E501"]
# Typographic characters that are matched on purpose (OCR/text normalisation, chunk prefix separator).
allowed-confusables = ["–", "‘", "’", "−", "×", "›", "∪"]

# Typer declares CLI parameters through call defaults; these calls are immutable markers.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-m 'not api'"
markers = [
    "integration: needs the built page cache / index (`make ingest`); skips cleanly when absent",
    "api: needs ANTHROPIC_API_KEY (excluded by default; run with `-m api`)",
]
