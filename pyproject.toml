[project]
name = "answer-engine"
version = "0.1.0"
description = "Answer engine for engineering documents: local extraction, hybrid retrieval, cited answers, staged evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf==1.28.2",
    "pdfplumber==0.11.10",
    "pytesseract==0.3.13",
    "pillow>=11.0",
    "docling==2.132.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "anthropic==1.11.0",
    "sentence-transformers==6.1.0",
    "numpy>=2.0",
    "pydantic>=2.0",
    "typer>=0.15",
    "rich>=13.0",
    "jiwer==4.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
ae = "ae.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ae"]
